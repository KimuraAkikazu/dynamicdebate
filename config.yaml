# LLMモデルの設定
llm:
  repo_id: "bartowski/Qwen2.5-7B-Instruct-GGUF"
  filename: "Meta-Llama-3.1-8B-Instruct-Q8_0.gguf"
  n_gpu_layers: -1
  n_ctx: 35000
  temperature: 0.3
  max_tokens: 1026

#Qwen2.5-7B-Instruct-Q8_0.gguf
  # Meta-Llama-3.1-8B-Instruct-Q8_0.gguf
  # Qwen2.5-7B-Instruct-Q8_0.gguf

# 議論全体の設定
discussion:
  topic: "Question:Statement 1 | A ring homomorphism is one to one if and only if the kernel is {0}. Statement 2 | Q is an ideal in R. Choice: A: True, True, B: False, False, C: True, False, D: False, True"
  max_turns: 50
  public_token_budget: 500   # 公開発言トークン上限
  min_consecutive_chunks: 2    # 割り込み前に保証する連続文数
  enable_interruption: false # true: 割り込みあり(既存), false: 割り込みなし(動的順序だが発話完了を待つ)
  early_stop:
    enabled: false
    require_consecutive: 1
    min_turns: 5
  thought_window: 10
  dynamic: true


# 参加エージェントの設定
agents:
  - name: "Alex"
    persona: "You are a character who is introverted, conscientious, agreeable, open to experience, emotionally stable."
  - name: "Chris"
    persona: "You are a character who is extroverted, conscientious, antagonistic, open to experience, and emotionally stable."
  - name: "Jenny"
    persona: "You are a character who is introverted, conscientious, agreeable, open to experience, and emotionally stable."

# ---- Adversary 設定 ----
adversary:
  enabled: true
  agent_names: ["Alex", "Chris"]    # 複数設定可能: ["Alex", "Chris"]
  target_strategy: "random_wrong"  # "random_wrong" | "fixed"
  fixed_label: "D"         # target_strategy: fixed のときのみ使用
